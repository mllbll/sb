map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream crowd_api {
    server crowd-api:8000;
}

upstream fight_api {
    server fight-api:8000;
}

upstream fall_api {
    server fall-api:8000;
}

upstream auth_api {
    server auth:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy — crowd density service
    location /ws/crowd {
        proxy_pass http://crowd_api/ws/crowd;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # WebSocket proxy — fight detection service
    location /ws/fight {
        proxy_pass http://fight_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # WebSocket proxy — fall detection service
    location /ws/fall {
        proxy_pass http://fall_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Auth API proxy
    location /api/auth/ {
        proxy_pass http://auth_api/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend REST API proxies. External paths keep modules separated.
    location /api/crowd/ {
        proxy_pass http://crowd_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/fight/ {
        proxy_pass http://fight_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/fall/ {
        proxy_pass http://fall_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health/crowd {
        proxy_pass http://crowd_api/health;
    }

    location = /health/fight {
        proxy_pass http://fight_api/health;
    }

    location = /health/fall {
        proxy_pass http://fall_api/health;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
