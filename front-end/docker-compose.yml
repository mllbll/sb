services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - auth
    # Allows nginx to reach backend services running on the host at localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  auth:
    build:
      context: ./auth-service
    environment:
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
    restart: unless-stopped
