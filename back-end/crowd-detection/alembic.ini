# alembic.ini — Alembic configuration for crowd-detection project.
# DB credentials are read from keys/secrets.json in migrations/env.py,
# so sqlalchemy.url here is intentionally left as a placeholder.

[alembic]
script_location = migrations

# Placeholder — overridden programmatically in env.py
sqlalchemy.url = postgresql://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
